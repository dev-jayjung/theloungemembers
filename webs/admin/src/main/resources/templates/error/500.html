<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <title>더 라운지</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <link rel="stylesheet" type="text/css" th:href="@{/css/design.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/common.css}">

    <script th:src="@{/js/jquery/jquery-3.7.1.min.js}"></script>
    <script type="text/javascript">
        $(document).ready(function(){
            // 팝업(window.open)으로 열린 창인지, 일반 창인지 구분해서 버튼 보이기
            if (window.opener !== undefined && window.opener !== null) {
                $('#openerView').show();
                $('#windowsView').hide();
            } else {
                $('#openerView').hide();
                $('#windowsView').show();
            }
        });
    </script>
</head>
<body>
    <div class="error_wrap">
        <div class="error">
            <h1>불편을 드려서 죄송합니다!</h1>
            <div class="cont01">
                <div class="mg5">
                    <!-- exMsg가 전달되면 표시하고, 없으면 기본 메시지 표시 -->
                    <th:block th:if="${exMsg != null and !#strings.isEmpty(exMsg)}" th:utext="${exMsg}"></th:block>
                    <th:block th:unless="${exMsg != null and !#strings.isEmpty(exMsg)}">
                        찾고 계시는 페이지가 삭제되었거나,<br />
                        이름이 변경되었거나 일시적인 오류로 표시할 수 없습니다.
                    </th:block>
                </div>

                <!-- 이전/메인 버튼 영역 -->

<!--                     <a th:href="${exUrl != null and !#strings.isEmpty(exUrl)} ? ${exUrl} : 'javascript:history.back();'"  -->
<!--                        class="btn_h60_type2">이전페이지</a> -->
<!--                     <a th:href="@{/admin/main}" class="btn_h60_type1 mgl8">메인</a> -->
<!--                 </div> -->

                <!-- 팝업일 때 닫기 버튼 영역 -->
<!--                 <div id="openerView" class="mt30" style="display: none;"> -->
<!--                     <a href="javascript://" onclick="self.close()" class="btn_h60_type1 mgl8">닫기</a> -->
<!--                 </div> -->
            </div>
            <div class="cont02">
            </div>
        </div>
    </div>
</body>
</html>
