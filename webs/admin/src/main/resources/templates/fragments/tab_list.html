<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="tabList">
  <script type="text/javascript">
    ((window, $) => {
      // 기본 레이아웃 높이 상수 설정
      const DEFAULT_HEIGHT = 1400;
      const FOOTER_HEIGHT = 287;

      // 탭 관리 메인 객체
      const tabList = {
        tabIdx: 0,
        list: [],
        activeList: [],

        /**
         * URL 기반으로 이미 열려있는 Tab ID 조회
         */
        getTabId(url) {
          const found = this.list.find(item => item.url === url);
          return found ? found.tabId : '';
        },

        /**
         * 탭 오픈 (기존 탭 활성화 또는 신규 탭/iframe 생성)
         * @param {Object} param - { url, realUrl, name, isHome }
         */
        open(param = {}) {
          const { url, realUrl, name, isHome } = param || {};

          if (!url || url === '/main') {
            return;
          }

          let openedTabId = this.getTabId(url);

          // 이미 열려있는 탭인 경우 활성화만 수행
          if (openedTabId) {
            this.activeTab({
              tabId: openedTabId,
              url: realUrl
            });
          } else {
            // 신규 탭 생성
            const tabId = `tabId${this.tabIdx++}`;
            openedTabId = tabId;

            this.list.push({
              tabId: tabId,
              url: url,
              isHome: !!isHome
            });

            // 탭 HTML 생성 (홈 탭은 닫기 버튼 제외)
            const $tabLi = isHome
              ? $(`<li id="${tabId}" style="float:left;" home="home">${name}</li>`)
              : $(`<li id="${tabId}" style="float:left;">${name}<a href="javascript:void(0)" class="btn-tab-close">x</a></li>`);

            // 탭 클릭 이벤트 바인딩
            $tabLi.on('click', e => {
              if ($(e.currentTarget).hasClass('btn-tab-close')) {
                return; // 닫기 버튼 클릭 시 클릭 이벤트 중지
              }

              if (typeof TabUtil !== 'undefined') {
                TabUtil.activate(tabId);
              }
            });

            // 탭 닫기 버튼 이벤트 바인딩
            $tabLi.find('.btn-tab-close').on('click', e => {
              e.stopPropagation();
              if (typeof TabUtil !== 'undefined') {
                TabUtil.close(tabId);
              }
            });

            $('#tabList').append($tabLi);

            this.activeTab({
              tabId: tabId,
              url: realUrl
            });
          }

          // 최상단 이동 및 스타일 정돈
          $(document).scrollTop(0);
          $('#screenList').css('height', 'auto');
          $(`#div_${openedTabId}`).css('overflow-y', 'hidden');

          return openedTabId;
        },

        /**
         * 탭 닫기
         * @param {String} tabId - 닫을 탭의 ID
         */
        close(tabId) {
          if (!tabId || typeof tabId !== 'string') {
            return;
          }

          // 탭 리스트에서 제거
          this.list = this.list.filter(item => item.tabId !== tabId);
          this.activeList = this.activeList.filter(id => id !== tabId);

          // DOM 요소 제거
          $(`#${tabId}`).remove();
          $(`#div_${tabId}`).remove();

          this.showActiveTab();
          this.openScreen();
        },

        /**
          * 탭 활성화 (활성화 이력 정리, Tab UI 강조, iframe 전환)
          * @param {Object} param - { tabId: string, url?: string }
          */
        activeTab(param = {}) {
          const { tabId, url } = param || {};

          if (!tabId) {
            return;
          }

          this.activeList = this.activeList.filter(id => id !== tabId);
          this.activeList.push(tabId);
          this.showActiveTab(tabId);
          this.openScreen({ tabId, url });
        },

        /**
         * 탭 활성화 UI 처리
         * @param {String} tabId
         */
        showActiveTab(tabId) {
          const activeTabId = tabId || this.activeList[this.activeList.length - 1];

          if (activeTabId) {
            $(`#tabList > li[id!="${activeTabId}"]`).removeClass('on');
            $(`#tabList > li[id="${activeTabId}"]`).addClass('on');
          }
        },

        /**
         * iframe 화면 제어 및 표시
         * @param {Object} param - { tabId: string, url?: string }
         */
        openScreen(param = {}) {
          const { tabId, url } = param || {};

          // 특정 tabId가 명시되어 들어온 경우
          if (tabId) {
            let $preDiv = $(`#div_${tabId}`);

            // 신규 탭 생성 (iframe 최초 생성)
            if ($preDiv.length === 0) {
              $preDiv = $(`<div id="div_${tabId}" style="width:100%; height:${DEFAULT_HEIGHT}px;"/>`);
              const $iframe = $(`<iframe name="iframe_${tabId}" width="100%" height="100%" style="border:0;" />`);

              $preDiv.append($iframe);
              $('#screenList').append($preDiv);

              if (typeof LoadingUtil !== 'undefined') {
                LoadingUtil.start();
              }

              // 이벤트 바인딩 후 src 속성 할당 (순서 보장)
              $iframe.off('load').one('load', () => {
                _resizeWindow({ tabId, newWindow: true });
                if (typeof LoadingUtil !== 'undefined') LoadingUtil.stop();
              });

              $iframe.attr('src', url);

              // 기존 탭 재오픈 요청 (URL 변경 및 강제 새로고침)
            } else if (url) {
              const $iframe = $preDiv.find('iframe:eq(0)');

              if (typeof LoadingUtil !== 'undefined') {
                LoadingUtil.start();
              }

              $iframe.off('load').one('load', () => {
                _resizeWindow({ tabId, newWindow: true });
                if (typeof LoadingUtil !== 'undefined') LoadingUtil.stop();
              });

              $iframe.attr('src', url);

              // 단순 탭 스위칭 (클릭 시 화면 전환만 수행)
            } else {
              _resizeWindow({ tabId });
            }

            // 화면 Show/Hide 처리
            $(`#screenList > div[id != "div_${tabId}"]`).hide();
            $preDiv.show();
          } else {
            // tabId 인자 없이 호출된 경우 (activeList 최상단 활성화)
            const activeTabId = this.activeList[this.activeList.length - 1];
            if (activeTabId) {
              $(`#screenList > div[id != "div_${activeTabId}"]`).hide();
              $(`#screenList > div[id = "div_${activeTabId}"]`).show();
              _resizeWindow({ tabId: activeTabId });
            }
          }
        }
      };

      /**
       * [내부 헬퍼] iframe 높이 자동 리사이징
       * @param {Object} param - { tabId: string, newWindow?: boolean }
       */
      const _resizeWindow = (param = {}) => {
        const { tabId, newWindow } = param || {};

        if (!tabId) {
          return;
        }

        const $div = $(`#screenList > div[id="div_${tabId}"]`);
        const $side = $('#side');
        let iframeHeight = 0;

        if (newWindow) {
          const iframeWin = window[`iframe_${tabId}`];
          if (iframeWin && iframeWin.document && iframeWin.document.body) {
            iframeHeight = iframeWin.document.body.scrollHeight;
          }
          if (iframeHeight > DEFAULT_HEIGHT) {
            $div.height(iframeHeight);
          }
        } else {
          iframeHeight = $div.height();
        }

        const finalHeight = Math.max(iframeHeight, DEFAULT_HEIGHT);
        $side.height(finalHeight + FOOTER_HEIGHT);
      };

      // TabUtil 및 외부 모듈에서 접근할 수 있도록 top/window 객체에 바인딩
      window.tabList = tabList;
      window._resizeWindow = _resizeWindow;

    })(window, jQuery);
  </script>

  <div class="tabWrap">
    <ul id="tabList"></ul>
    <a href="javascript:void(0)" onclick="TabUtil.closeAll()" class="tabAllClear">탭 전체삭제</a>
  </div>
</th:block>

</html>
