<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default_layout}">

<head>
    <title>API 에러 로그 조회</title>
</head>

<th:block layout:fragment="script">
    <script th:inline="javascript">
        (() => {
            let apiErrorLogGrid;

            $(() => {
                // Tabulator 그리드 생성
                createApiErrorLogGrid();

                $('#searchForm').on('change', '#searchTarget', e => {
                    const $this = $(e.currentTarget);
                    const $searchValue = $('#searchValue');
                    if (!!$this.val()) {
                        $searchValue.prop('disabled', false);
                    } else {
                        $searchValue.val('');
                        $searchValue.prop('disabled', true);
                    }
                });

                $('#btnSearch').on('click', reloadGrid);
                $('#btnReset').on('click', resetSearchForm);
                $('#btnExcel').on('click', downloadExcel);
            });

            const createApiErrorLogGrid = () => {
                apiErrorLogGrid = GridUtil.init('#apiErrorLogList', {
                    ajaxURL: '/api/api-error-logs',

                    // 검색 폼 파라미터 지정
                    ajaxParams: () => {
                        const params = FormUtil.serialize('#searchForm');

                        const startDate = $('#searchStartDate').val();
                        const endDate = $('#searchEndDate').val();

                        if (startDate) {
                            params.startDtm = startDate + 'T00:00:00';
                        }
                        if (endDate) {
                            params.endDtm = endDate + 'T23:59:59';
                        }

                        return params;
                    },

                    useCreatedAt: true,
                    columns: [
                        { title: '코드', field: 'uid', hozAlign: 'center' },
                        { title: '접속 계정', field: 'accountId', hozAlign: 'center' },
                        { title: 'API 코드', field: 'apiCode', hozAlign: 'center' },
                        { title: '트랜잭션 ID', field: 'transactionId', hozAlign: 'left' },
                        { title: '에러 코드', field: 'errorCode', hozAlign: 'center' },
                        { title: '에러 내용', field: 'errorMsg', width: 250, hozAlign: 'left' },
                        { title: '응답 전문', field: 'response', width: 250, hozAlign: 'left' },
                        { title: 'GET 인자', field: 'argumentGet', width: 250, hozAlign: 'left' },
                        { title: 'POST 인자', field: 'argumentPost', width: 250, hozAlign: 'left' },
                        { title: 'USER_AGENT', field: 'argumentUserAgent', width: 250, hozAlign: 'left' },
                        { title: 'IP 주소', field: 'ipAddress', hozAlign: 'center' }
                    ]
                });
            }

            // 검색
            const reloadGrid = () => {
                const searchTarget = $('#searchTarget').val();
                const searchValue = $('#searchValue').val();

                if (!!searchTarget && !searchValue) {
                    alert('검색어를 입력해 주세요.');
                    return;
                }

                if (apiErrorLogGrid) {
                    apiErrorLogGrid.setData();
                }
            }

            // 초기화
            const resetSearchForm = () => {
                FormUtil.reset('#searchForm');
                $('#searchValue').prop('disabled', true);
            }

            const downloadExcel = () => {
                apiErrorLogGrid.download('xlsx', 'API_에러_로그_목록.xlsx');
            }
        })();
    </script>
</th:block>

<th:block layout:fragment="content">
    <div>
        <!-- 검색 조건 박스 -->
        <div class="table_type1">
            <form id="searchForm" name="searchForm" method="get">
                <table>
                    <colgroup>
                        <col style="width:12%;">
                        <col>
                        <col style="width:12%;">
                        <col>
                    </colgroup>
                    <tbody>
                        <tr>
                            <th scope="row">검색조건</th>
                            <td>
                                <select name="searchTarget" id="searchTarget" class="wth100">
                                    <option value="">전체</option>
                                    <option value="uid" th:selected="${searchTarget == 'uid'}">코드</option>
                                    <option value="transaction_id" th:selected="${searchTarget == 'transaction_id'}">트랜잭션 ID</option>
                                    <option value="error_code" th:selected="${searchTarget == 'error_code'}">에러 코드</option>
                                    <option value="response_like" th:selected="${searchTarget == 'response_like'}">응답전문</option>
                                    <option value="argument_get_like" th:selected="${searchTarget == 'argument_get_like'}">GET 전달인자</option>
                                    <option value="argument_post_like" th:selected="${searchTarget == 'argument_post_like'}">POST 전달인자</option>
                                    <option value="ip_address" th:selected="${searchTarget == 'ip_address'}">IP 주소</option>
                                </select>
                                <input type="text" name="searchValue" id="searchValue" class="wth150" placeholder="검색어 입력"
                                       th:value="${searchValue}" th:disabled="${searchTarget == null or searchTarget == ''}">
                            </td>
                            <th scope="row">등록 기간</th>
                            <td>
                                <input type="date" id="searchStartDate" class="wth150">
                                ~
                                <input type="date" id="searchEndDate" class="wth150">
                            </td>
                        </tr>
                        <tr>
                            <th scope="row">접속 계정</th>
                            <td>
                                <select name="accountId" class="wth200">
                                    <option value="">전체</option>
                                    <option th:each="member : ${apiMemberList}"
                                            th:value="${member.accountId}"
                                            th:text="|${member.companyName}(${member.accountId})|">
                                    </option>
                                </select>
                            </td>
                            <th scope="row">API 코드</th>
                            <td>
                                <select name="apiCode" class="wth250">
                                    <option value="">전체</option>
                                    <option th:each="menu : ${apiMenuList}"
                                            th:value="${menu.code}"
                                            th:text="|${menu.name}(${menu.code})|">
                                    </option>
                                </select>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </form>
        </div>

        <!-- 버튼 영역 -->
        <div class="btn_area_center">
            <button type="button" id="btnSearch" class="btn_type2">검색</button>
            <button type="button" id="btnReset" class="btn_type1">초기화</button>
        </div>

        <div class="mTitle gTitle">
            <h2>API 에러 로그 목록</h2>
        </div>
        <div class="mButton typeBorad">
            <div class="leftInner">
                <button type="button" id="btnExcel" class="btn_type1"><span class="icoExl">엑셀 다운로드</span></button>
            </div>
        </div>

        <!-- Tabulator 그리드가 위치할 영역 -->
        <div class="mModule">
            <div id="apiErrorLogList"></div>
        </div>
    </div>
</th:block>
</html>
