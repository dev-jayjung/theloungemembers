<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/default_layout}">

<head>
  <title th:text="${member == null || member.uid == null} ? '사용자 등록' : '사용자 상세'">사용자 상세</title>
</head>

<th:block layout:fragment="script">
  <script type="text/javascript" th:inline="javascript">
    (() => {
      $(() => {
        EditorUtil.init('txtContent');

        $('#btnInsert').on('click', memberInsert);
        $('#btnUpdate').on('click', memberUpdate);
        $('#btnDelete').on('click', memberDelete);
        $('#btnList').on('click', () => TabUtil.open({ url: '/api-members' }));
      });

      // 등록
      const memberInsert = () => {
        if (!FormUtil.validate.check('#memberForm')) {
          return;
        }

        if (!confirm('등록 하시겠습니까?')) {
          return;
        }

        EditorUtil.sync('txtContent');

        const data = FormUtil.serialize('#memberForm');

        AjaxUtil.call({
          url: /*[[@{/api/api-members}]]*/ '/api/api-members',
          data,
          callBack: result => {
            if (!result.success) {
              return;
            }

            const uid = result.data.uid;

            TabUtil.open({
              url: `/api-members/detail?id=${uid}`
            });
          }
        });
      }

      // 수정
      const memberUpdate = () => {
        if (!FormUtil.validate.check('#memberForm')) {
          return;
        }

        if (!confirm('수정 하시겠습니까?')) {
          return;
        }

        const uid = $('#uid').val();

        AjaxUtil.call({
          url: `/api/api-members/${uid}`,
          data: FormUtil.serialize('#memberForm'),
          type: 'PUT',
          callBack: result => {
            if (!result.success) {
              return;
            }

            TabUtil.open({
              url: `/api-members/detail?id=${uid}`
            });
          }
        });
      }

      // 삭제
      const memberDelete = () => {
        if (!confirm('삭제 하시겠습니까?')) {
          return;
        }

        const uid = $('#uid').val();

        AjaxUtil.call({
          url: `/api/api-members/${uid}`,
          type: 'DELETE',
          callBack: result => {
            if (!result.success) {
              return;
            }

            TabUtil.openAndCloseSelf({
              openUrl: '/api-members'
            });
          }
        });
      }
    })();
  </script>
</th:block>

<th:block layout:fragment="content">
  <form name="memberForm" id="memberForm" method="post" th:object="${member}">

    <th:block th:if="${member != null && member.uid != null}">
      <div class="mTitle gTitle">
        <h2>기본정보</h2>
      </div>
      <div class="mModule type2Grid">
        <table class="table_type1 mg5">
          <caption>기본정보</caption>
          <colgroup>
            <col style="width:200px;" />
            <col />
            <col style="width:200px;" />
            <col />
          </colgroup>
          <tbody>
            <tr>
              <th>코드 번호<strong class="red">*</strong></th>
              <td>
                <input type="text" class="wth200" name="uid" id="uid" title="코드 번호" th:field="*{uid}" disabled />
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </th:block>

    <div class="mTitle gTitle">
      <h2>계정정보</h2>
    </div>
    <div class="mModule type2Grid">
      <table class="table_type1 mg5">
        <caption>계정정보</caption>
        <colgroup>
          <col style="width:140px;" />
          <col />
          <col style="width:140px;" />
          <col />
          <col style="width:140px;" />
          <col />
        </colgroup>
        <tbody>
          <tr>
            <th>접속 계정<strong class="red">*</strong></th>
            <td>
              <input type="text" class="wth200 validate[required]" name="accountId" id="accountId"
                th:field="*{accountId}" th:readonly="${member?.uid != null}" title="접속 계정" />
            </td>
            <th>비밀번호</th>
            <td>
              <input type="text" class="wth200" name="password" id="password" th:field="*{password}" title="비밀번호" />
            </td>
          </tr>
          <tr>
            <th>업체명<strong class="red">*</strong></th>
            <td>
              <input type="text" class="wth200 validate[required]" name="companyName" id="companyName"
                th:field="*{companyName}" title="업체명" />
            </td>
            <th>서비스 코드<strong class="red">*</strong></th>
            <td>
              <th:block
                th:replace="~{fragments/tag :: selectBox(name='serviceCode', target=${ServiceCode}, clazz='wth100 validate[required]', textKey='description', defaultType='select', selectedValue=*{serviceCode})}" />
            </td>
          </tr>
          <tr>
            <th>라운지 영문 코드</th>
            <td>
              <input type="text" class="wth200" name="loungeCode" id="loungeCode" th:field="*{loungeCode}"
                title="라운지 영문 코드" />
            </td>
            <th>라운지명</th>
            <td>
              <input type="text" class="wth200" name="loungeName" id="loungeName" th:field="*{loungeName}"
                title="라운지명" />
            </td>
            <th>라운지 코드</th>
            <td>
              <input type="text" class="wth200" name="loungeUid" id="loungeUid" th:field="*{loungeUid}"
                title="라운지 코드" />
            </td>
          </tr>
          <tr>
            <th>IP 검사 해제</th>
            <td>
              <th:block
                th:replace="~{fragments/tag :: checkboxGroup(name='freepassIp', label='IP 검사 해제', checkedValues=${member.freepassIp})}" />
            </td>
            <th>LMS 통지 허용</th>
            <td>
              <th:block
                th:replace="~{fragments/tag :: checkboxGroup(name='allowMsgNotify', label='LMS 통지 허용(coupon_issue에서 사용됨)', checkedValues=${member.allowMsgNotify})}" />
            </td>
          </tr>
          <tr>
            <th>사 용<strong class="red">*</strong></th>
            <td>
              <th:block
                th:replace="~{fragments/tag :: radioGroup(name='onService', target=${ServiceStatus}, checkedValue=${member.onService})}" />
            </td>
          </tr>
          <tr>
            <th>API 정보 목록</th>
            <td colspan="5">
              <div th:each="group, stat : ${apiMenuGroupList}">
                <span style='font-weight: bold;' th:text="${group.name}"></span>
                <div th:each="menu : ${group.menuList}">
                  <input type="checkbox" name="selectedMenuCodes" th:id="|menu_${menu.code}|" th:value="${menu.code}"
                    th:checked="${member.allowedMenuCodes != null and #lists.contains(member.allowedMenuCodes, group.code + ':' + menu.code)}" />

                  <label th:for="|menu_${menu.code}|" th:text="|${menu.name}(${menu.code})|"></label>
                </div>
              </div>
            </td>
          </tr>
          <tr>
            <th>암호화 사용 유무<strong class="red">*</strong></th>
            <td>
              <label class="fRadio"><input type="radio" name="isEncrypted" id="isEncrypted0" value="1"
                  th:field="*{isEncrypted}"><span>사용 O</span></label>
              <label class="fRadio"><input type="radio" name="isEncrypted" id="isEncrypted1" value="0"
                  th:field="*{isEncrypted}"><span>사용 X</span></label>
            </td>
          </tr>
          <tr>
            <th>암호화 정보</th>
            <td>
              <input type="text" class="wth200" name="encInfo" id="encInfo" th:value="${encInfo}" title="암호화 정보" />
            </td>
            <th>비밀키</th>
            <td>
              <input type="text" class="wth200" name="encKey" id="encKey" th:value="${encKey}" title="암호화 정보" />
            </td>
            <th>비밀키</th>
            <td>
              <input type="text" class="wth200" name="encIv" id="encIv" th:value="${encIv}" title="암호화 정보" />
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="mTitle gTitle">
      <h2>담당자정보</h2>
    </div>
    <div class="mModule type2Grid">
      <table class="table_type1 mg5">
        <caption>담당자정보</caption>
        <colgroup>
          <col style="width:140px;" />
          <col />
          <col style="width:140px;" />
          <col />
          <col style="width:140px;" />
          <col />
        </colgroup>
        <tbody>
          <tr>
            <th>담당자명</th>
            <td>
              <input type="text" class="wth200" name="userName" id="userName" th:field="*{userName}" title="담당자명" />
            </td>
            <th>핸드폰 번호</th>
            <td>
              <input type="text" class="wth200 phoneNumber" name="phoneNum" id="phoneNum" th:field="*{phoneNum}"
                title="핸드폰 번호" />
            </td>
            <th>이메일 주소</th>
            <td>
              <input type="text" class="wth200" name="emailAddress" id="emailAddress" th:field="*{emailAddress}"
                title="이메일 주소" />
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="mTitle gTitle">
      <h2>기타정보</h2>
    </div>
    <div class="mModule type2Grid">
      <table class="table_type1 mg5">
        <caption>기타정보</caption>
        <colgroup>
          <col style="width:140px;" />
          <col />
          <col style="width:140px;" />
          <col />
        </colgroup>
        <tbody>
          <tr>
            <th>메 모</th>
            <td colspan="3">
              <div class="fTextarea gFull">
                <textarea name="memo" id="memo" title="메 모" rows="100" cols="200" th:field="*{memo}"></textarea>
              </div>
            </td>
          </tr>
          <tr th:if="${member != null && member.uid != null}">
            <th>등록일 / 수정일</th>
            <td colspan="3"
              th:text="|${#temporals.format(member.regDate, 'yyyy-MM-dd HH:mm:ss')} / ${#temporals.format(member.updateDate, 'yyyy-MM-dd HH:mm:ss')}|">
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <textarea name="content" id="txtContent" rows="10" cols="100" style="width:100%; height:412px;"></textarea>
  </form>

  <!-- 하단 버튼 영역 -->
  <div class="btn_area_center">
    <button type="button" id="btnInsert" class="btn_type2" th:if="${member == null || member.uid == null}">등록</button>

    <th:block th:if="${member != null && member.uid != null}">
      <button type="button" id="btnUpdate" class="btn_type2">수정</button>
      <button type="button" id="btnDelete" class="btn_type2">삭제</button>
    </th:block>

    <button type="button" id="btnList" class="btn_type1">목록</button>
  </div>
</th:block>

</html>
