<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default_layout}">

<head>
    <title>API 이용 기록 조회</title>
</head>

<th:block layout:fragment="script">
    <script th:inline="javascript">
        let apiUsageLogGrid;

        $(document).ready(function() {
            // Tabulator 그리드 생성
            createApiUsageLogGrid();

            $('#searchForm').on('change', '#searchTarget', function () {
                const $searchValue = $('#searchValue');
                if (!!$(this).val()) {
                    $searchValue.prop('disabled', false);
                } else {
                    $searchValue.val('');
                    $searchValue.prop('disabled', true);
                }
            });
        });

        function createApiUsageLogGrid() {
            apiUsageLogGrid = initTabulatorGrid('#apiUsageLogList', {
                ajaxURL: '/api/api-usage-logs',

                // 검색 폼 파라미터 지정
                ajaxParams: function() {
                    const params = $('#searchForm').serializeJson();

                    const startDate = $('#searchStartDate').val();
                    const endDate = $('#searchEndDate').val();

                    if (startDate) {
                        params.startDtm = startDate + 'T00:00:00';
                    }
                    if (endDate) {
                        params.endDtm = endDate + 'T23:59:59';
                    }

                    return params;
                },

                useCreatedAt: true,
                columns: [
                    { title: '코드', field: 'uid', hozAlign: 'center' },
                    { title: '접속 계정', field: 'accountId', hozAlign: 'center' },
                    { title: 'API 코드', field: 'apiCode', hozAlign: 'center' },
                    { title: '트랜잭션 ID', field: 'transactionId', hozAlign: 'left' },
                    {
                        title: '성공 여부',
                        field: 'result',
                        hozAlign: 'center',
                        formatter: function(cell) {
                            return cell.getValue() === 'S' ? '성공' : '<p style="color:red;">실패</p>';
                        },
                    },
                    { title: '전달인자', field: 'argument', width: 350, hozAlign: 'left' },
                    { title: '응답 전문', field: 'response', width: 350, hozAlign: 'left' },
                    { title: 'IP 주소', field: 'ipAddress', hozAlign: 'center' }
                ]
            });
        }

        // 검색
        function reloadGrid() {
            const searchTarget = $('#searchTarget').val();
            const searchValue = $('#searchValue').val();

            if (!!searchTarget && !searchValue) {
                alert('검색어를 입력해 주세요.');
                return;
            }

            if (apiUsageLogGrid) {
                apiUsageLogGrid.setData();
            }
        }

        // 초기화
        function resetSearchForm() {
            resetForm('searchForm');
        }

        function downloadExcel() {
            apiUsageLogGrid.download('xlsx', 'API_이용_기록_목록.xlsx');
        }
    </script>
</th:block>

<body>
    <div layout:fragment="content">
        <!-- 검색 조건 박스 -->
        <div class="table_type1">
            <form id="searchForm" name="searchForm" method="get">
                <table>
                    <colgroup>
                        <col style="width:12%;">
                        <col>
                        <col style="width:12%;">
                        <col>
                    </colgroup>
                    <tbody>
                        <tr>
                            <th scope="row">검색조건</th>
                            <td>
                                <select name="searchTarget" id="searchTarget" class="wth100">
                                    <option value="">전체</option>
                                    <option value="uid">코드</option>
                                    <option value="api_code">API 코드</option>
                                    <option value="transaction_id">트랜잭션 ID</option>
                                    <option value="argument_like">전달인자</option>
                                    <option value="response_like">응답전문</option>
                                    <option value="ip_address">IP 주소</option>
                                </select>
                                <input type="text" name="searchValue" id="searchValue" class="wth150" placeholder="검색어 입력" disabled>
                            </td>
                            <th scope="row">등록 기간</th>
                            <td>
                                <input type="date" id="searchStartDate" class="wth150">
                                ~
                                <input type="date" id="searchEndDate" class="wth150">
                            </td>
                        </tr>
                        <tr>
                            <th scope="row">접속 계정</th>
                            <td>
                                <select name="accountId" class="wth200">
                                    <option value="">전체</option>
                                    <option th:each="member : ${apiMemberList}"
                                            th:value="${member.accountId}"
                                            th:text="|${member.companyName}(${member.accountId})|">
                                    </option>
                                </select>
                            </td>
                            <th scope="row">API 코드</th>
                            <td>
                                <select name="apiCode" class="wth250">
                                    <option value="">전체</option>
                                    <option th:each="menu : ${apiMenuList}"
                                            th:value="${menu.code}"
                                            th:text="|${menu.name}(${menu.code})|">
                                    </option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <th scope="row">성공 여부</th>
                            <td>
                                <select name="result" class="wth100">
                                    <option value="">전체</option>
                                    <option value="S">성공</option>
                                    <option value="F">실패</option>
                                </select>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </form>
        </div>

        <!-- 버튼 영역 -->
        <div class="btn_area_center">
            <button type="button" onclick="reloadGrid();" class="btn_type2">검색</button>
            <button type="button" onclick="resetSearchForm();" class="btn_type1">초기화</button>
        </div>

        <div class="mTitle gTitle">
            <h2>API 이용 기록 목록</h2>
        </div>
        <div class="mButton typeBorad">
            <div class="leftInner">
                <button type="button" onclick="downloadExcel();" class="btn_type1"><span class="icoExl">엑셀 다운로드</span></button>
            </div>
        </div>

        <!-- Tabulator 그리드가 위치할 영역 -->
        <div class="mModule">
            <div id="apiUsageLogList"></div>
        </div>
    </div>
</body>
</html>
