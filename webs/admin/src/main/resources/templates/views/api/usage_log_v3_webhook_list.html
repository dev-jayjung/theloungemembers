<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default_layout}">

<head>
    <title>V3 API 이용 로그(Webhook) 조회</title>
</head>

<th:block layout:fragment="script">
    <script th:inline="javascript">
        let apiUsageLogV3WebhookGrid;

        $(document).ready(function() {
            // Tabulator 그리드 생성
            createApiUsageLogV3WebhookGrid();

            $('#searchForm').on('change', '#searchTarget', function () {
                const $searchValue = $('#searchValue');
                if (!!$(this).val()) {
                    $searchValue.prop('disabled', false);
                } else {
                    $searchValue.val('');
                    $searchValue.prop('disabled', true);
                }
            });
        });

        function createApiUsageLogV3WebhookGrid() {
            apiUsageLogV3WebhookGrid = initTabulatorGrid('#apiUsageLogV3WebhookList', {
                ajaxURL: '/api/api-usage-logs-v3-webhook',

                // 검색 폼 파라미터 지정
                ajaxParams: function() {
                    const params = $('#searchForm').serializeJson();

                    const startDate = $('#searchStartDate').val();
                    const endDate = $('#searchEndDate').val();

                    if (startDate) {
                        params.startDtm = startDate + 'T00:00:00';
                    }
                    if (endDate) {
                        params.endDtm = endDate + 'T23:59:59';
                    }

                    return params;
                },

                useCreatedAt: true,
                columns: [
                    { title: '코드', field: 'uid', hozAlign: 'center' },
                    { title: '대분류', field: 'categoryMajor', hozAlign: 'center' },
                    { title: '중분류', field: 'categoryMiddle', hozAlign: 'center' },
                    { title: '트랜잭션 ID', field: 'transactionId', hozAlign: 'left' },
                    { title: '요청값', field: 'request', width: 500, hozAlign: 'left' },
                    { title: '응답값', field: 'response', width: 500, hozAlign: 'left' }
                ]
            });
        }

        // 검색
        function reloadGrid() {
            const searchTarget = $('#searchTarget').val();
            const searchValue = $('#searchValue').val();

            if (!!searchTarget && !searchValue) {
                alert('검색어를 입력해 주세요.');
                return;
            }

            if (apiUsageLogV3WebhookGrid) {
                apiUsageLogV3WebhookGrid.setData();
            }
        }

        // 초기화
        function resetSearchForm() {
            resetForm('searchForm');
        }

        function downloadExcel() {
            apiUsageLogV3WebhookGrid.download('xlsx', 'V3_API_이용_로그_Webhook_목록.xlsx');
        }
    </script>
</th:block>

<body>
    <div layout:fragment="content">
        <!-- 검색 조건 박스 -->
        <div class="table_type1">
            <form id="searchForm" name="searchForm" method="get">
                <table>
                    <colgroup>
                        <col style="width:12%;">
                        <col>
                        <col style="width:12%;">
                        <col>
                    </colgroup>
                    <tbody>
                        <tr>
                            <th scope="row">검색조건</th>
                            <td>
                                <select name="searchTarget" id="searchTarget" class="wth100">
                                    <option value="">전체</option>
                                    <option value="transaction_id">트랜잭션 ID</option>
                                </select>
                                <input type="text" name="searchValue" id="searchValue" class="wth150" placeholder="검색어 입력" disabled>
                            </td>
                            <th scope="row">등록 기간</th>
                            <td>
                                <input type="date" id="searchStartDate" class="wth150">
                                ~
                                <input type="date" id="searchEndDate" class="wth150">
                            </td>
                        </tr>
                    </tbody>
                </table>
            </form>
        </div>

        <!-- 버튼 영역 -->
        <div class="btn_area_center">
            <button type="button" onclick="reloadGrid();" class="btn_type2">검색</button>
            <button type="button" onclick="resetSearchForm();" class="btn_type1">초기화</button>
        </div>

        <!-- 로그 보관 정책 안내 -->
        <div style="background-color:#e7f3ff; border:1px solid #b6d4fe; border-left:5px solid #0d6efd; border-radius:6px; padding:9px 12px; margin:12px 0; color:#084298; box-sizing:border-box;">
            <div style="font-weight:600; margin-bottom:6px;">※ 로그 보관 정책</div>
            <div style="font-size:13px; line-height:1.5;">Webhook 로그의 최대 보관일은 <strong style="color:#052c65;">60일</strong>입니다.</div>
        </div>

        <div class="mTitle gTitle">
            <h2>V3 API 이용 로그(Webhook) 목록</h2>
        </div>
        <div class="mButton typeBorad">
            <div class="leftInner">
                <button type="button" onclick="downloadExcel();" class="btn_type1"><span class="icoExl">엑셀 다운로드</span></button>
            </div>
        </div>

        <!-- Tabulator 그리드가 위치할 영역 -->
        <div class="mModule">
            <div id="apiUsageLogV3WebhookList"></div>
        </div>
    </div>
</body>
</html>
