<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main_layout}"> <!-- 기존 mainLayout 상속 -->

<head>
    <!-- JSP의 <t:putAttribute name="title"> 대응 -->
    <title>더 라운지 관리자 시스템</title>
</head>

<!-- JSP의 <t:putAttribute name="script"> 대응 (main_layout의 script fragment로 주입) -->
<th:block layout:fragment="script">
    <script type="text/javascript">
        function companyNoticeView(compNtcNo) {
            createTargetFormSubmit({
                id: 'noticeView',
                url: '/company/noticeView.do',
                target: '_blank',
                data: {
                    compNtcNo: compNtcNo
                }
            });
        }

        function noticeView(bbsId, lettNo) {
            createTargetFormSubmit({
                id: 'noticeView',
                url: '/bbsLetterView.do',
                target: '_blank',
                data: {
                    bbsId: bbsId,
                    lettNo: lettNo
                }
            });
        }

        // iframe 높이 동적 계산 스크립트
        function makeHeight() {
            const height = $(window).innerHeight();
            $('iframe').css({'height': (height - 126) + 'px'});
        }

        $(document).on('load resize', function() {
            makeHeight();
        });
    </script>
</th:block>

<body>

</body>
</html>
